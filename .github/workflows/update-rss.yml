name: Update RSS feeds

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download and validate feeds
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          feeds = {
              "nyt.xml": "https://rss.nytimes.com/services/xml/rss/nyt/World.xml",
              "ftm.xml": "https://www.ftm.nl/feed/",
          }

          for filename, url in feeds.items():
              request = urllib.request.Request(
                  url, headers={"User-Agent": "myrss-feed-reader/1.0"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read(2_000_001)

              if len(data) > 2_000_000:
                  raise ValueError(f"{filename}: feed exceeds 2 MB")

              root = ET.fromstring(data)
              if root.tag not in ("rss", "{http://www.w3.org/2005/Atom}feed"):
                  raise ValueError(f"{filename}: not an RSS or Atom feed")

              Path(filename).write_bytes(data)
              print(f"Updated {filename}")
          PY

      - name: Commit changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nyt.xml ftm.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update RSS feeds"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push
          fi
